<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>福岡旅遊 6/16–6/21</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylineDecorator.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI','Microsoft JhengHei',sans-serif; background:#f0f2f5; height:100vh; display:flex; flex-direction:column; }

#header {
  background:#2c3e50; color:white;
  padding:10px 18px; font-size:16px; font-weight:bold;
  display:flex; align-items:center; gap:10px; flex-shrink:0;
}

#body { display:flex; flex:1; overflow:hidden; }

/* ── 行程欄 ── */
#itin {
  width:340px; flex-shrink:0;
  overflow-y:auto; background:#fafafa;
  border-right:1px solid #ddd;
}

.day-block { border-bottom:2px solid #eee; }

.day-title {
  padding:10px 14px; color:white; font-weight:bold; font-size:13px;
  position:sticky; top:0; z-index:2;
  display:flex; align-items:center; gap:6px;
}

.weather-bar {
  padding:5px 14px; font-size:11px; color:#555;
  background:#f8f9fa; border-bottom:1px solid #eee;
}

.itin-row {
  padding:7px 14px; font-size:12.5px; line-height:1.5;
  display:flex; align-items:flex-start; gap:8px;
  border-bottom:1px solid #f0f0f0;
}

.itin-row .ico { flex-shrink:0; font-size:14px; }

/* 可點擊的地點 */
.map-link {
  background: none; border:none; cursor:pointer;
  font-size:12.5px; line-height:1.5; text-align:left;
  color:#1a73e8; text-decoration:underline dotted;
  padding:0; font-family:inherit;
}
.map-link:hover { color:#0d47a1; }

.itin-note {
  margin:4px 14px 10px; padding:7px 10px;
  background:#fff8e1; border-left:3px solid #f9a825;
  font-size:11.5px; color:#666; border-radius:0 6px 6px 0;
}

/* ── 地圖 ── */
#map { flex:1; min-width:0; position:relative; }

/* 圖例 */
#legend {
  position:absolute; bottom:28px; right:10px; z-index:1000;
  background:white; border-radius:8px; padding:8px 12px;
  box-shadow:0 2px 8px rgba(0,0,0,0.2); font-size:11px;
}
.leg { display:flex; align-items:center; gap:6px; margin-bottom:3px; }
.leg:last-child { margin-bottom:0; }
.leg-dot { width:11px; height:11px; border-radius:50%; flex-shrink:0; }

/* ── 手機版 RWD ── */
@media (max-width: 767px) {
  #body { position:relative; }

  #itin {
    width:100%; border-right:none;
    /* 手機版改為底部 drawer，由 JS 控制 */
    display:block !important;
    position:fixed;
    bottom:0; left:0; right:0;
    height:52vh;
    border-radius:18px 18px 0 0;
    box-shadow:0 -4px 24px rgba(0,0,0,0.22);
    z-index:2000;
    transform:translateY(100%);
    transition:transform 0.35s cubic-bezier(.4,0,.2,1);
    overflow-y:auto;
    background:#fafafa;
  }
  #itin.drawer-open { transform:translateY(0); }

  /* 拖曳把手 */
  #drawer-handle {
    display:flex; justify-content:center; align-items:center;
    padding:10px 0 6px;
    background:#fafafa;
    border-radius:18px 18px 0 0;
    position:sticky; top:0; z-index:3;
    cursor:grab;
  }
  #drawer-handle::before {
    content:'';
    width:40px; height:4px;
    background:#ccc; border-radius:2px;
  }

  /* 遮罩 */
  #drawer-overlay {
    display:none;
    position:fixed; inset:0;
    background:rgba(0,0,0,0.3);
    z-index:1999;
  }
  #drawer-overlay.show { display:block; }

  /* 漂浮按鈕 FAB */
  #fab {
    display:flex;
    position:fixed;
    bottom:24px; left:16px;
    z-index:1500;
    background:#2c3e50;
    color:white;
    border:none; border-radius:50px;
    padding:10px 18px;
    font-size:14px; font-weight:bold;
    box-shadow:0 4px 14px rgba(0,0,0,0.35);
    cursor:pointer;
    align-items:center; gap:7px;
    transition:background 0.2s;
  }
  #fab:active { background:#1a252f; }

  #legend { bottom:16px; right:8px; font-size:10px; padding:6px 9px; }
  #map { flex:1; width:100%; }
}

@media (min-width: 768px) {
  #fab, #drawer-overlay, #drawer-handle { display:none !important; }
}
</style>
</head>
<body>

<div id="header">🗾 福岡旅遊　6/16 – 6/21</div>

<div id="body">
  <div id="itin"><div id="drawer-handle"></div></div>
  <div id="map"></div>
</div>

<div id="drawer-overlay" onclick="closeDrawer()"></div>
<button id="fab" onclick="openDrawer()">📋 行程</button>

  fullful:      { name:"The Full Full Hakata", cat:"bread", lat:33.589928, lng:130.412529 },
  sansui:       { name:"山水水出珈琲", cat:"bread", lat:33.594606, lng:130.405984 },

const refCatColor = {
  motsu:"#e67e22", seafood:"#e67e22", ramen:"#c0392b",

const refCatIcon = {

  bread:"麵包／咖啡", shop:"購物", bar:"酒吧", yatai:"屋台"

/* ── 行程資料 ── */
const days = [
  {
    label:"0️⃣ 6/16 (二) 福岡", color:"#7f8c8d",
    weather:"🌤️ 晴時多雲　30°C／21°C　降水確率 60%",
    rows:[
      { ico:"✈️", text:"班機：CI116 16:40-20:00　｜　桃園 T2 出發　→　福岡 國際線航廈 入境" },

    ]
  },
  {
    label:"1️⃣ 6/17 (三) 福岡", color:"#f39c12",
    weather:"☀️ 晴　31°C／22°C　降水確率 30%",
    rows:[
      { ico:"🚶", text:"上午 散步走走：", spot:"tenjin_ug", after:" ／ ", spot2:"shirogane" },
      { ico:"🏠", text:"15:00　抵達 Airbnb，放行李／休息" },
      { ico:"📍", text:"16:00-18:00　", spot:"teamlab", after:"（建議停留 1.5～2 小時）" },
      { ico:"🍜", text:"18:30　晚餐：", spot:"ryuen" },

  },
  {
    label:"2️⃣ 6/18 (四) 糸島", color:"#1abc9c",
    weather:"🌧️ 雨　24°C／21°C　降水確率 90%",
    rows:[
      { ico:"🚌", text:"09:00　出發前往糸島（車程約 60 分鐘）" },
      { ico:"📍", text:"10:00-12:30　", spot:"shirataki", after:"（白絲瀑布）" },
      { ico:"🍜", text:"13:00　午餐：", spot:"tsukamoto", after:"（生魚片料理，海鮮超豐富）" },
      { ico:"☕", text:"14:30-16:30　糸島海邊咖啡廳" },
      { ico:"🍜", text:"18:00　晚餐：", spot:"hakatami" },
      { ico:"🏠", text:"住：", spot:"airbnb_tabisai" },
    ]
  },
  {
    label:"3️⃣ 6/19 (五) 別府 & 由布院", color:"#9b59b6",
    weather:"🌧️ 雨時々曇　27°C／21°C　降水確率 80%",
    rows:[
      { ico:"🚌", text:"08:00　出發前往別府（車程約 2.5～3 小時）" },

    rows:[

      { ico:"🛍️", text:"21:00　自由活動，逛中洲 / 買伴手禮" },

  },

    note:"※ 附近有福岡麵包超人博物館（建議 10:00 入館，玩樂約 1.5 小時），如班機改為下午班次可排入。",
    rows:[
      { ico:"🍜", text:"07:30　飯店早餐" },
      { ico:"🧳", text:"09:00　整理退房，寄放行李" },
      { ico:"🛍️", text:"09:30　", spot:"hakata_sta", after:"& 福岡機場伴手禮採購" },
      { ico:"✈️", text:"班機：CI111 11:00-12:30　｜　福岡 國際線航廈 出發　→　桃園 T2 入境　", spot:"airport_fuk" },
    ]
  },
];

/* ── 地圖初始化 ── */
const map = L.map('map').setView([33.55, 130.80], 9);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution:'© OpenStreetMap'
}).addTo(map);

/* 圖例 */
const legendEl = document.createElement('div');
legendEl.id = 'legend';
function pinSvg(color) {
  return `<svg width="14" height="18" viewBox="0 0 14 18" style="flex-shrink:0">
    <ellipse cx="7" cy="6.5" rx="6" ry="6" fill="${color}"/>
    <polygon points="7,18 3,11 11,11" fill="${color}"/>
    <ellipse cx="7" cy="6.5" rx="2.5" ry="2.5" fill="white" opacity="0.7"/>
  </svg>`;
}
function diamondSvg(color) {
  return `<svg width="14" height="14" viewBox="0 0 14 14" style="flex-shrink:0">
    <rect x="2" y="2" width="10" height="10" rx="2" transform="rotate(45 7 7)" fill="white" stroke="${color}" stroke-width="2"/>
  </svg>`;
}
legendEl.innerHTML = `
  <div style="font-size:10px;font-weight:bold;color:#555;margin-bottom:4px;border-bottom:1px solid #eee;padding-bottom:3px;">主行程</div>
  <div class="leg">${pinSvg('#e74c3c')} ✈️ 機場</div>
  <div class="leg">${pinSvg('#3498db')} 🏠 住宿</div>
  <div class="leg">${pinSvg('#e67e22')} 🍜 餐廳</div>
  <div class="leg">${pinSvg('#27ae60')} 📍 景點</div>
  <div style="font-size:10px;font-weight:bold;color:#555;margin:6px 0 4px;border-bottom:1px solid #eee;padding-bottom:3px;">參考清單 ◇</div>
  <div class="leg">🍖 牛腸鍋</div>
  <div class="leg">🦑 海鮮</div>
  <div class="leg">🍜 拉麵</div>
  <div class="leg">🍞 麵包/咖啡</div>
  <div class="leg">🛍️ 購物</div>
  <div class="leg">🍺 酒吧</div>
  <div class="leg">🏮 屋台</div>`;
document.getElementById('map').appendChild(legendEl);

/* 建立所有 marker */
const markers = {};
Object.entries(spots).forEach(([id, s]) => {
  const icon = L.divIcon({
    className:'',
    html:`<div style="
      background:${typeColor[s.type]};
      color:white;
      width:32px; height:32px;
      border-radius:50% 50% 50% 0;
      transform:rotate(-45deg);
      border:2px solid white;
      box-shadow:0 2px 6px rgba(0,0,0,0.4);
      display:flex; align-items:center; justify-content:center;
    "><span style="transform:rotate(45deg);font-size:15px;line-height:1">${typeIcon[s.type]}</span></div>`,
    iconSize:[32,32], iconAnchor:[16,32]
  });
  markers[id] = L.marker([s.lat, s.lng], { icon })
    .addTo(map)
    .bindPopup(`<b>${typeIcon[s.type]} ${s.name}</b><br><a href="https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}" target="_blank" style="font-size:11px;color:#1a73e8;">📍 在 Google Maps 開啟</a>`);
});

/* 建立參考地點 marker */
const refMarkers = {};
Object.entries(refSpots).forEach(([id, s]) => {
  const color = refCatColor[s.cat];
  const icon = L.divIcon({
    className:'',
    html:`<div style="
      width:26px; height:26px;
      border-radius:4px;
      transform:rotate(45deg);
      border:2.5px solid ${color};
      background:white;
      box-shadow:0 1px 5px rgba(0,0,0,0.35);
      display:flex; align-items:center; justify-content:center;
    "><span style="transform:rotate(-45deg);font-size:13px;line-height:1">${refCatIcon[s.cat]}</span></div>`,
    iconSize:[26,26], iconAnchor:[13,13]
  });
  refMarkers[id] = L.marker([s.lat, s.lng], { icon })
    .addTo(map)
    .bindPopup(`<b>${refCatIcon[s.cat]} ${s.name}</b><br><small style="color:#888">${refCatLabel[s.cat]}</small><br><a href="https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}" target="_blank" style="font-size:11px;color:#1a73e8;">📍 在 Google Maps 開啟</a>`);
});

/* 點擊地點跳轉 */
function flyTo(id) {
  const s = spots[id];
  map.flyTo([s.lat, s.lng], 15, { duration:0.8 });
  setTimeout(() => markers[id].openPopup(), 900);
}
function flyToRef(id) {
  const s = refSpots[id];
  map.flyTo([s.lat, s.lng], 16, { duration:0.8 });
  setTimeout(() => refMarkers[id].openPopup(), 900);
}

/* 建立每天的地點 ID 集合 */
const daySpotIds = {};
days.forEach(day => {
  const ids = new Set();
  day.rows.forEach(row => {
    if (row.spot) ids.add(row.spot);
    if (row.spot2) ids.add(row.spot2);
  });
  daySpotIds[day.label] = ids;
});

/* 淡化／還原 marker */
function setMarkersOpacity(activeDayLabel) {
  Object.entries(markers).forEach(([id, marker]) => {
    const el = marker.getElement();
    if (!el) return;
    if (!activeDayLabel) {
      el.style.opacity = '1';
      el.style.filter = '';
    } else if (daySpotIds[activeDayLabel] && daySpotIds[activeDayLabel].has(id)) {
      el.style.opacity = '1';
      el.style.filter = '';
    } else {
      el.style.opacity = '0.45';
      el.style.filter = 'grayscale(80%)';
    }
  });
  // 參考地點：選天路線時一律淡化
  Object.values(refMarkers).forEach(marker => {
    const el = marker.getElement();
    if (!el) return;
    el.style.opacity = activeDayLabel ? '0.3' : '1';
    el.style.filter = activeDayLabel ? 'grayscale(90%)' : '';
  });
}

/* 當天路線連線 */
let activeLayers = [];
let activeDay = null;

function clearRoute() {
  activeLayers.forEach(l => map.removeLayer(l));
  activeLayers = [];
}

function toggleDayRoute(day) {
  // 收集當天有座標的地點（依順序）
  const coords = [];
  day.rows.forEach(row => {
    if (row.spot && spots[row.spot]) coords.push([spots[row.spot].lat, spots[row.spot].lng]);
    if (row.spot2 && spots[row.spot2]) coords.push([spots[row.spot2].lat, spots[row.spot2].lng]);
  });
  if (coords.length < 2) return;

  // 若已顯示同一天 → 取消
  if (activeDay === day.label) {
    clearRoute();
    setMarkersOpacity(null);
    activeDay = null;
    return;
  }

  clearRoute();

  // 閉合：最後一點回到第一點（住宿）
  const closedCoords = [...coords, coords[0]];

  // 畫路線
  const line = L.polyline(closedCoords, {
    color: day.color,
    weight: 3,
    opacity: 0.85,
    dashArray: '8, 5'
  }).addTo(map);
  activeLayers.push(line);

  // 加箭頭
  const decorator = L.polylineDecorator(line, {
    patterns: [{
      offset: '5%',
      repeat: '15%',
      symbol: L.Symbol.arrowHead({
        pixelSize: 10,
        polygon: false,
        pathOptions: {
          color: day.color,
          weight: 2.5,
          opacity: 1
        }
      })
    }]
  }).addTo(map);
  activeLayers.push(decorator);

  activeDay = day.label;
  setMarkersOpacity(day.label);
  map.fitBounds(line.getBounds(), { padding:[40,40] });
}

/* 點擊地圖空白處 → 恢復全部 */
map.on('click', () => {
  if (!activeDay) return;
  clearRoute();
  setMarkersOpacity(null);
  activeDay = null;
});

/* ── 建立行程 HTML ── */
const itinEl = document.getElementById('itin');

days.forEach(day => {
  const block = document.createElement('div');

  const title = document.createElement('div');

  title.style.background = day.color;
  title.textContent = day.label + '  🗺️';
  title.style.cursor = 'pointer';
  title.title = '點擊顯示當天路線';
  title.addEventListener('click', () => toggleDayRoute(day));
  block.appendChild(title);

  const weather = document.createElement('div');
  weather.className = 'weather-bar';
  weather.textContent = day.weather;
  block.appendChild(weather);

  day.rows.forEach(row => {
    const div = document.createElement('div');
    div.className = 'itin-row';

    const ico = document.createElement('span');
    ico.className = 'ico';
    ico.textContent = row.ico;
    div.appendChild(ico);

    const content = document.createElement('span');

    // 前置文字
    if (row.text) content.appendChild(document.createTextNode(row.text));

    // 第一個地點連結
    if (row.spot) {
      const btn = document.createElement('button');
      btn.className = 'map-link';
      btn.textContent = spots[row.spot].name;
      btn.onclick = () => flyTo(row.spot);
      content.appendChild(btn);
    }

    // 中間文字
    if (row.after) content.appendChild(document.createTextNode(row.after));

    // 第二個地點連結
    if (row.spot2) {
      const btn2 = document.createElement('button');
      btn2.className = 'map-link';
      btn2.textContent = spots[row.spot2].name;
      btn2.onclick = () => flyTo(row.spot2);
      content.appendChild(btn2);
    }

    div.appendChild(content);
    block.appendChild(div);
  });

  if (day.note) {
    const note = document.createElement('div');
    note.className = 'itin-note';
    note.textContent = day.note;
    block.appendChild(note);
  }

  itinEl.appendChild(block);
});

/* ── 手機 Drawer ── */
function openDrawer() {
  document.getElementById('itin').classList.add('drawer-open');
  document.getElementById('drawer-overlay').classList.add('show');
  document.getElementById('fab').style.display = 'none';
}
function closeDrawer() {
  document.getElementById('itin').classList.remove('drawer-open');
  document.getElementById('drawer-overlay').classList.remove('show');
  document.getElementById('fab').style.display = '';
}

// 滑動把手向下關閉 drawer（只在 handle 區域生效，不影響內容滾動）
(function(){
  const handle = document.getElementById('drawer-handle');
  const drawer = document.getElementById('itin');
  let startY = 0, dragging = false;

  handle.addEventListener('touchstart', e => {
    startY = e.touches[0].clientY;
    dragging = true;
    drawer.style.transition = 'none';
  }, { passive:true });

  handle.addEventListener('touchmove', e => {
    if (!dragging) return;
    const dy = e.touches[0].clientY - startY;
    if (dy > 0) {
      drawer.style.transform = `translateY(${Math.min(dy, 260)}px)`;
    }
  }, { passive:true });

  handle.addEventListener('touchend', e => {
    if (!dragging) return;
    drawer.style.transition = '';
    const dy = e.changedTouches[0].clientY - startY;
    if (dy > 80) {
      drawer.style.transform = '';
      closeDrawer();
    } else {
      drawer.style.transform = '';
    }
    dragging = false;
  });
})();
</script>
