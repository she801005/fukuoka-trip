<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>福岡旅遊 6/16–6/21</title>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI','Microsoft JhengHei',sans-serif; background:#f0f2f5; height:100vh; display:flex; flex-direction:column; }

#header {
  background:#2c3e50; color:white;
  padding:10px 18px; font-size:16px; font-weight:bold;
  display:flex; align-items:center; gap:10px; flex-shrink:0;
}

#body { display:flex; flex:1; overflow:hidden; }

/* ── 行程欄 ── */
#itin {
  width:340px; flex-shrink:0;
  overflow-y:auto; background:#fafafa;
  border-right:1px solid #ddd;
}

.day-block { border-bottom:2px solid #eee; }

.day-title {
  padding:10px 14px; color:white; font-weight:bold; font-size:13px;
  position:sticky; top:0; z-index:2;
  display:flex; align-items:center; gap:6px;
}

.weather-bar {
  padding:5px 14px; font-size:11px; color:#555;
  background:#f8f9fa; border-bottom:1px solid #eee;
}

.itin-row {
  padding:7px 14px; font-size:12.5px; line-height:1.5;
  display:flex; align-items:flex-start; gap:8px;
  border-bottom:1px solid #f0f0f0;
}

.itin-row .ico { flex-shrink:0; font-size:14px; }

/* 可點擊的地點 */
.map-link {
  background: none; border:none; cursor:pointer;
  font-size:12.5px; line-height:1.5; text-align:left;
  color:#1a73e8; text-decoration:underline dotted;
  padding:0; font-family:inherit;
}
.map-link:hover { color:#0d47a1; }

.itin-note {
  margin:4px 14px 10px; padding:7px 10px;
  background:#fff8e1; border-left:3px solid #f9a825;
  font-size:11.5px; color:#666; border-radius:0 6px 6px 0;
}

/* ── 航班區塊 ── */
.flight-section {
  margin:6px 10px 10px;
  background:#eaf4ff;
  border:1px solid #b8d9f5;
  border-radius:8px;
  overflow:hidden;
}
.flight-section-title {
  background:#c8e4f8; color:#1a5276;
  font-size:11px; font-weight:bold;
  padding:4px 10px; letter-spacing:0.5px;
}
.flight-row {
  display:flex; align-items:flex-start; gap:8px;
  padding:6px 10px; font-size:11.5px; color:#333;
  border-top:1px solid #d4eaf8;
}
.flight-row:first-of-type { border-top:none; }
.flight-badge {
  flex-shrink:0; font-size:10px; font-weight:bold;
  padding:2px 6px; border-radius:10px; color:white;
  background:#2980b9;
}
.flight-badge.arr { background:#27ae60; }
.flight-badge.dep { background:#e74c3c; }
.flight-warn {
  font-size:10.5px; color:#c0392b; margin-top:2px;
}

/* ── 地圖 ── */
#map { flex:1; min-width:0; position:relative; }

/* 圖例 */
#legend {
  position:absolute; top:10px; right:10px; z-index:1000;
  background:white; border-radius:8px; padding:8px 12px;
  box-shadow:0 2px 8px rgba(0,0,0,0.2); font-size:11px;
}
.leg { display:flex; align-items:center; gap:6px; margin-bottom:3px; }
.leg:last-child { margin-bottom:0; }
.leg-dot { width:11px; height:11px; border-radius:50%; flex-shrink:0; }

/* ── 手機版 RWD ── */
@media (max-width: 767px) {
  #body { position:relative; }

  #itin {
    width:100%; border-right:none;
    /* 手機版改為底部 drawer，由 JS 控制 */
    display:block !important;
    position:fixed;
    bottom:0; left:0; right:0;
    height:52vh;
    border-radius:18px 18px 0 0;
    box-shadow:0 -4px 24px rgba(0,0,0,0.22);
    z-index:2000;
    transform:translateY(100%);
    transition:transform 0.35s cubic-bezier(.4,0,.2,1);
    overflow-y:auto;
    background:#fafafa;
  }
  #itin.drawer-open { transform:translateY(0); }

  /* 拖曳把手 */
  #drawer-handle {
    display:flex; justify-content:center; align-items:center;
    padding:8px 14px 6px;
    background:#fafafa;
    border-radius:18px 18px 0 0;
    position:sticky; top:0; z-index:3;
    cursor:grab;
    border-bottom:1px solid #eee;
    gap:8px;
  }
  #drawer-handle .handle-bar {
    flex:1; display:flex; justify-content:center;
  }
  #drawer-handle .handle-bar::before {
    content:'';
    width:40px; height:4px;
    background:#ccc; border-radius:2px;
    display:block;
  }
  #drawer-close {
    background:none; border:none; cursor:pointer;
    font-size:18px; color:#999; padding:0 2px; line-height:1;
    flex-shrink:0;
  }
  #drawer-close:active { color:#333; }

  /* 遮罩：只蓋 drawer 正上方一小條，讓地圖區可互動 */
  #drawer-overlay {
    display:none;
    position:fixed;
    bottom:52vh; left:0; right:0;
    height:6px;         /* 極薄，僅作關閉用途 */
    background:transparent;
    z-index:1999;
  }
  #drawer-overlay.show { display:block; }

  /* 漂浮按鈕 FAB */
  #fab {
    display:flex;
    position:fixed;
    bottom:24px; left:16px;
    z-index:1500;
    background:#2c3e50;
    color:white;
    border:none; border-radius:50px;
    padding:10px 18px;
    font-size:14px; font-weight:bold;
    box-shadow:0 4px 14px rgba(0,0,0,0.35);
    cursor:pointer;
    align-items:center; gap:7px;
    transition:background 0.2s;
  }
  #fab:active { background:#1a252f; }

  #legend { top:8px; right:8px; font-size:10px; padding:6px 9px; }
  #legend-toggle { display:block !important; }
  #legend-body { display:none; margin-top:4px; }
  #legend-body.open { display:block; }
  #map { flex:1; width:100%; }
}

@media (min-width: 768px) {
  #fab, #drawer-overlay, #drawer-handle { display:none !important; }
}
</style>

/* 依日期高亮/淡化 markers */
function highlightDay(date) {
  const ds = {};
  days.forEach((day, i) => {
    const d = botData.dayMap[String(i)];
    if (d) {
      ds[d] = day.rows.flatMap(r => [r.spot, r.spot2].filter(Boolean));
      if (day.flights && day.flights.length) ds[d].push('airport_fuk');
    }
  });
  Object.entries(markers).forEach(([id, m]) => {
    const active = !date || (ds[date] && ds[date].includes(id));
    const el = m.getElement();
    if (el) el.style.filter = active ? '' : 'grayscale(1) opacity(0.5)';
  });
  // 選特定日期時隱藏參考清單 markers
  Object.values(refMarkers).forEach(m => {

/* 當天路線連線 */
let activeLayers = [];
let activeDay = null;

function clearRoute() {
  activeLayers.forEach(l => map.removeLayer(l));
  activeLayers = [];
}

function toggleDayRoute(day) {
  // 收集當天有座標的地點（依順序）
  const coords = [];
  day.rows.forEach(row => {
    if (row.spot && spots[row.spot]) coords.push([spots[row.spot].lat, spots[row.spot].lng]);
    if (row.spot2 && spots[row.spot2]) coords.push([spots[row.spot2].lat, spots[row.spot2].lng]);
  });
  if (coords.length < 2) return;

  // 若已顯示同一天 → 取消
  if (activeDay === day.label) {
    clearRoute();
    setMarkersOpacity(null);
    activeDay = null;
    return;
  }

  clearRoute();

  // 閉合：最後一點回到第一點（住宿）
  const closedCoords = [...coords, coords[0]];

  // 畫路線
  const line = L.polyline(closedCoords, {
    color: day.color,
    weight: 3,
    opacity: 0.85,
    dashArray: '8, 5'
  }).addTo(map);
  activeLayers.push(line);

  // 加箭頭
  const decorator = L.polylineDecorator(line, {
    patterns: [{
      offset: '5%',
      repeat: '15%',
      symbol: L.Symbol.arrowHead({
        pixelSize: 10,
        polygon: false,
        pathOptions: {
          color: day.color,
          weight: 2.5,
          opacity: 1
        }
      })
    }]
  }).addTo(map);
  activeLayers.push(decorator);

  activeDay = day.label;
  setMarkersOpacity(day.label);
  map.fitBounds(line.getBounds(), { padding:[40,40] });
}

/* 點擊地圖空白處 → 恢復全部 */
map.on('click', () => {
  if (!activeDay) return;
  clearRoute();
  setMarkersOpacity(null);
  activeDay = null;
});

// 滑動把手向下關閉 drawer（只在 handle 區域生效，不影響內容滾動）
(function(){
  const handle = document.getElementById('drawer-handle');
  const drawer = document.getElementById('itin');
  let startY = 0, dragging = false;

  handle.addEventListener('touchstart', e => {
    startY = e.touches[0].clientY;
    dragging = true;
    drawer.style.transition = 'none';
  }, { passive:true });

  handle.addEventListener('touchmove', e => {
    if (!dragging) return;
    const dy = e.touches[0].clientY - startY;
    if (dy > 0) {
      drawer.style.transform = `translateY(${Math.min(dy, 260)}px)`;
    }
  }, { passive:true });

  handle.addEventListener('touchend', e => {
    if (!dragging) return;
    drawer.style.transition = '';
    const dy = e.changedTouches[0].clientY - startY;
    if (dy > 80) {
      drawer.style.transform = '';
      closeDrawer();
    } else {
      drawer.style.transform = '';
    }
    dragging = false;
  });
})();

function botReply(q) {
  const t = q.toLowerCase().replace(/\s/g,'');

  // 找日期（提前）
  const dateMatch = t.match(/6\/(1[6-9]|2[01])/);
  const date = dateMatch ? dateMatch[0] : null;

  // 打招呼
  if (/你好|哈囉|hi|hello|嗨|早|晚/.test(t))
    return '你好！我是福岡旅遊助理 🗾\n可以問我：行程、天氣、住宿、餐廳、景點，或輸入「幫助」看完整功能 😊';

  // 幫助
  if (/幫助|help|功能|可以問|怎麼用/.test(t))
    return '📋 可以問我：\n• 「行程」— 當天完整行程（請先選日期）\n• 「6/18 天氣」— 當天天氣\n• 「住宿」或「6/19 住哪」\n• 「餐廳」或「6/20 吃什麼」\n• 「班機」— 出發/回程資訊\n• 「幾號去別府」「teamlab幾點」等';

  // 行程 - 當天完整行程
  if (/行程/.test(t)) {
    if (date) {
      const dayIdx = botData.dayMap[date];
      if (dayIdx !== undefined) {
        const day = days[parseInt(dayIdx)];
        const lines = day.rows.map(r => {
          let txt = r.ico + ' ' + r.text.trim();
          if (r.spot && spots[r.spot]) txt += sl(r.spot);
          if (r.after) txt += r.after;
          return txt;
        });
        const flightLines = (day.flights||[]).map(f=>
          `✈️ ${f.no} ${f.time} ${f.route}`
        );
        const result = `📅 ${dateLabel[date]||date} 完整行程：\n` + lines.join('\n');
        return flightLines.length ? result + `\n\n✈️ 當日航班：\n` + flightLines.join('\n') : result;
      }
    }
    // 無日期 → 全部完整行程
    const nums = ['0️⃣','1️⃣','2️⃣','3️⃣','4️⃣','5️⃣'];
    return `🗾 福岡旅遊　${botData.trip.start}–${botData.trip.end}（${botData.trip.days}天）\n\n` +
      days.map((day, i) => {
        const lines = day.rows.map(r => {
          let txt = r.ico + ' ' + r.text.trim();
          if (r.spot && spots[r.spot]) txt += sl(r.spot);
          if (r.after) txt += r.after;
          if (r.spot2 && spots[r.spot2]) txt += sl(r.spot2);
          return txt;
        });
        const flightLines = (day.flights||[]).map(f => `✈️ ${f.no} ${f.time} ${f.route}`);
        let block = `${nums[i]} ${botData.dayNames[i]}\n` + lines.join('\n');
        if (flightLines.length) block += `\n✈️ 當日航班：\n` + flightLines.join('\n');
        return block;
      }).join('\n\n─────────────\n\n');
  }

  // 班機
  if (/班機|飛機|幾點飛|幾點到|回程|ci1|jx8|br1|航班/.test(t)) {
    const f = botData.flights;
    if (date) {
      const dayFlights = [...f.out, ...f.back].filter(v => v.date === date);
      if (dayFlights.length)
        return `✈️ ${dateLabel[date]||date} 航班：\n` + dayFlights.map(v=>`• ${v.no}　${v.dep}→${v.arr}\n  ${v.note}`).join('\n');
      return `${dateLabel[date]||date} 無航班安排。`;
    }
    const outStr = f.out.map(v=>`✈️ ${v.no}　${dateLabel[v.date]||v.date} ${v.dep}→${v.arr}　${v.note}`).join('\n');
    const backStr = f.back.map(v=>`✈️ ${v.no}　${dateLabel[v.date]||v.date} ${v.dep}→${v.arr}　${v.note}`).join('\n');
    return `【去程】\n${outStr}\n\n【回程】\n${backStr}`;
  }

  // 天氣
  if (/天氣|氣溫|幾度|下雨|晴|溫度/.test(t)) {
    if (date && botData.weather[date])
      return `📅 ${dateLabel[date]||date} 天氣：\n${botData.weather[date]}`;
    return '天氣（請指定日期）：\n' +
      Object.entries(botData.weather).map(([d,w])=>`${dateLabel[d]||d}　${w}`).join('\n');
  }

  // 住宿
  if (/住宿|住哪|飯店|airbnb|旅館|check/.test(t)) {
    if (date && botData.hotels[date]) {
      const hid = hotelSpotMap[date];
      const link = hid ? sl(hid) : botData.hotels[date];
      return `🏠 ${dateLabel[date]||date} 住宿：\n${link}`;
    }
    return '🏠 住宿資訊：\n' +
      Object.entries(botData.hotels).map(([d,h]) => {
        const hid = hotelSpotMap[d];
        return `${dateLabel[d]||d}　${hid ? sl(hid) : h}`;
      }).join('\n');
  }

  // 餐廳 / 吃什麼
  if (/餐廳|吃什麼|吃哪|午餐|晚餐|美食|推薦吃/.test(t)) {
    if (date) {
      const res = botData.restaurants.filter(r=>r.day===date);
      if (res.length) return `🍽️ ${dateLabel[date]||date} 餐廳：\n`+res.map(r=>`• ${r.meal}：${r.spot ? sl(r.spot) : r.name}`).join('\n');
      return `${dateLabel[date]||date} 無特定預訂餐廳，可自由選擇 😊`;
    }
    return '🍽️ 餐廳總覽：\n'+botData.restaurants.map(r=>`${dateLabel[r.day]||r.day} ${r.meal}：${r.spot ? sl(r.spot) : r.name}`).join('\n');
  }

  // 景點
  if (/景點|去哪|活動|玩什麼/.test(t)) {
    function renderSpotEntry(s) {
      const links = s.spots.map(id => sl(id)).filter(Boolean).join(' ');
      return `• ${s.name}${links ? '　'+links : ''}`;
    }
    if (date) {
      const sp = botData.spotsByDay[date];
      if (sp) return `📍 ${dateLabel[date]||date} 景點：\n`+sp.map(renderSpotEntry).join('\n');
      return `${dateLabel[date]||date} 為出發或返台日，無景點安排。`;
    }
    return '📍 景點總覽：\n'+Object.entries(botData.spotsByDay).map(([d,ss])=>
      `${dateLabel[d]||d}：\n`+ss.map(renderSpotEntry).join('\n')
    ).join('\n');
  }

  // 特定地點
  if (/teamlab|teamLab|teamlab/.test(t)) return '🎨 teamLab Forest Fukuoka\n📅 6/17（三）16:00–18:00\n📍 福岡市 地行浜2-2-6\n建議停留 1.5–2 小時';
  if (/safari|african|動物/.test(t)) return '🦁 九州自然動物公園 African Safari\n📅 6/19（五）11:30–14:00\n📍 大分県宇佐市 安心院町南畑2-1755-1';
  if (/地獄|別府|beppu/.test(t)) return '♨️ 別府地獄巡禮\n📅 6/19（五）15:30–16:30\n• 海地獄（蔚藍溫泉池）\n• かまど地獄\n📍 別府市鉄輪エリア';
  if (/由布院|湯布院|yufu/.test(t)) return '🏔️ 由布院\n📅 6/19（五）晚間入住\n住宿：Airbnb 久保的小屋\n📍 湯布院町川上3634-1';
  if (/白糸|瀑布|waterfall/.test(t)) return '💧 白糸の滝 & ふれあいの里\n📅 6/18（四）10:00–12:30\n📍 糸島市白糸460-6';
  if (/marine|水族|海之中道/.test(t)) return '🐬 Marine World 海之中道水族館\n📅 6/20（六）14:30–16:30\n• 海豚秀、企鵝、白鯨\n📍 福岡市 西戸崎18-28';
  if (/糸島|itoshima/.test(t)) return '🌊 6/18（四）糸島日遊\n• 白糸の滝（10:00–12:30）\n• 塚本鮮魚店 午餐\n• 海邊咖啡廳（14:30–16:30）\n交通：福岡市區車程約 60 分鐘';
  if (/牛腸|もつ鍋|内臓/.test(t)) return '🍖 推薦牛腸鍋：\n• 樂天地 博多站前店\n• 前田屋 博多店\n• 一藤 博多店\n• ちんぷんかんぷん 春吉店\n（側欄「參考清單」可查地圖位置）';
  if (/拉麵|ramen/.test(t)) return '🍜 推薦拉麵：\n• 博多一幸舎 総本店\n（博多豚骨拉麵代表店）';
  if (/咖啡|cafe|coffee|パン|麵包/.test(t)) return '☕ 推薦咖啡/麵包：\n• BOUL\'ANGE（本店 & 天神地下街店）\n• AMAM DACOTAN Ropponmatsu\n• FUGLEN KEYAKI DORI\n• 山水水出珈琲\n• Little Stand Daimyo\n• The Full Full Hakata';

  // 參考清單
  if (/參考|推薦|牛腸|もつ|seafood|海鮮|拉麵|ramen|麵包|bread|購物|shop|酒吧|bar|屋台|yatai/.test(t)) {
    const catNames = { motsu:'🍖 牛腸鍋', seafood:'🐟 海鮮', ramen:'🍜 拉麵', bread:'🥐 麵包/咖啡', shop:'🛍️ 購物', bar:'🍺 酒吧', yatai:'🏮 屋台' };
    const grouped = {};
    Object.entries(refSpots).forEach(([id, s]) => {
      if (!grouped[s.cat]) grouped[s.cat] = [];
      grouped[s.cat].push({ id, name: s.name });
    });
    return '📋 參考清單（地圖◇圖示）：\n' +
      Object.entries(grouped).map(([cat, list]) =>
        `\n${catNames[cat] || cat}\n` +
        list.map(r => `<a href="#" class="bot-spot-link" data-id="${r.id}" data-type="ref" style="color:#1a73e8;text-decoration:underline;cursor:pointer;">${r.name}</a>`).join('\n')
      ).join('');
  }

  // 找不到
  return '🤔 我不太確定這個問題…\n可以試試問：\n「行程總覽」「6/19 天氣」「住宿」「餐廳」「班機」或輸入「幫助」';
}

/* ── 聊天 UI ── */
(function(){
  // 注入 CSS
  const style = document.createElement('style');
  style.textContent = `
    #chat-fab {
      position:fixed; bottom:24px; right:16px; z-index:3000;
      width:auto; height:44px; border-radius:22px;
      padding:0 14px; gap:6px;
      background:#2c3e50; color:white; border:none; cursor:pointer;
      font-size:14px; box-shadow:0 4px 14px rgba(0,0,0,0.35);
      display:flex; align-items:center; justify-content:center;
      transition:background 0.2s;
    }
    #chat-fab:active { background:#1a252f; }
    #chat-panel {
      position:fixed; bottom:86px; right:16px; z-index:2999;
      width:300px; max-width:calc(100vw - 32px);
      background:white; border-radius:16px;
      box-shadow:0 8px 32px rgba(0,0,0,0.22);
      display:flex; flex-direction:column;
      overflow:hidden;
      transform:scale(0.8) translateY(20px);
      transform-origin:bottom right;
      opacity:0; pointer-events:none;
      transition:transform 0.22s ease, opacity 0.22s ease;
    }
    #chat-panel.open { transform:scale(1) translateY(0); opacity:1; pointer-events:all; }
    #chat-header {
      background:#2c3e50; color:white;
      padding:12px 14px; font-size:13px; font-weight:bold;
      display:flex; align-items:center; justify-content:space-between;
    }
    #chat-close { background:none; border:none; color:white; font-size:18px; cursor:pointer; line-height:1; }
    #chat-messages {
      flex:1; overflow-y:auto; padding:12px;
      display:flex; flex-direction:column; gap:8px;
      max-height:320px; min-height:120px;
    }
    .msg { max-width:85%; padding:8px 11px; border-radius:12px; font-size:12.5px; line-height:1.55; white-space:pre-wrap; }
    .msg-bot { background:#f0f2f5; color:#222; align-self:flex-start; border-bottom-left-radius:4px; }
    .msg-user { background:#2c3e50; color:white; align-self:flex-end; border-bottom-right-radius:4px; }
    #chat-input-row {
      display:flex; gap:6px; padding:10px 12px;
      border-top:1px solid #eee;
    }
    #chat-input {
      flex:1; border:1px solid #ddd; border-radius:20px;
      padding:7px 12px; font-size:12.5px; outline:none;
      font-family:inherit;
    }
    #chat-input:focus { border-color:#2c3e50; }
    #chat-send {
      background:#2c3e50; color:white; border:none;
      border-radius:50%; width:34px; height:34px;
      cursor:pointer; font-size:14px; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
    }
    #chat-send:active { background:#1a252f; }
    .chat-chips {
      display:flex; flex-wrap:wrap; gap:5px; padding:0 12px 10px;
    }
    .chip {
      background:#f0f2f5; border:1px solid #ddd; border-radius:12px;
      padding:4px 10px; font-size:11px; cursor:pointer; color:#444;
    }
    .chip:active { background:#e0e4e8; }
  `;
  document.head.appendChild(style);

  // 注入 HTML
  const fab = document.createElement('button');
  fab.id = 'chat-fab';
  fab.innerHTML = '<span style="font-size:18px">💬</span><span style="font-size:12px;font-weight:600;letter-spacing:0.5px">Trip</span>';
  fab.title = '旅遊助理';

  const panel = document.createElement('div');
  panel.id = 'chat-panel';
  panel.innerHTML = `
    <div id="chat-header">
      <span>🗾 福岡旅遊助理</span>
      <button id="chat-close">✕</button>
    </div>
    <div id="chat-messages"></div>
    <div style="padding:0 12px 6px;">
      <select id="chat-date" style="width:100%;padding:6px 8px;border-radius:8px;border:1px solid #ddd;font-size:13px;color:#444;background:#f8f9fa;">
        <option value="">📋 全部日期</option>
        <option disabled>──────────</option>
        <option value="6/16">📅 6/16 (二) 抵達福岡</option>
        <option value="6/17">📅 6/17 (三) 福岡</option>
        <option value="6/18">📅 6/18 (四) 糸島</option>
        <option value="6/19">📅 6/19 (五) 別府 &amp; 由布院</option>
        <option value="6/20">📅 6/20 (六) 福岡</option>
        <option value="6/21">📅 6/21 (日) 返台</option>
      </select>
    </div>
    <div class="chat-chips">
      <span class="chip" data-q="行程">行程</span>
      <span class="chip" data-q="住宿">住宿</span>
      <span class="chip" data-q="餐廳">餐廳</span>
      <span class="chip" data-q="天氣">天氣</span>
      <span class="chip" data-q="班機">班機</span>
      <span class="chip" data-q="參考清單">參考清單</span>
    </div>
    <div id="chat-input-row">
      <input id="chat-input" placeholder="問我任何行程問題…" />
      <button id="chat-send">➤</button>
    </div>
  `;
  document.body.appendChild(fab);
  document.body.appendChild(panel);

  const msgs = panel.querySelector('#chat-messages');

  function addMsg(text, type) {
    const d = document.createElement('div');
    d.className = 'msg msg-' + type;
    // 支援 HTML 連結；純文字換行轉 <br>
    const hasHtml = /<a /.test(text);
    if (hasHtml) {
      d.innerHTML = text.replace(/\n/g, '<br>');
      d.querySelectorAll('.bot-spot-link').forEach(a => {
        a.style.cssText = 'color:#1a73e8;text-decoration:underline;cursor:pointer;';
        a.onclick = e => {
          e.preventDefault();
          const id = a.dataset.id;
          if (a.dataset.type === 'main') flyTo(id);
          else flyToRef(id);
        };
      });
    } else {
      d.textContent = text;
    }
    msgs.appendChild(d);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function ask(q) {
    if (!q.trim()) return;
    addMsg(q, 'user');
    const reply = botReply(q);
    setTimeout(() => {
      addMsg(reply, 'bot');
      const dm = q.match(/6\/(1[6-9]|2[01])/);
      highlightDay(dm ? dm[0] : null);
      // 查詢參考清單時，無論選哪天都顯示 refMarkers
      if (/參考|推薦|牛腸|もつ|seafood|海鮮|拉麵|ramen|麵包|bread|購物|shop|酒吧|bar|屋台|yatai/.test(q)) {
        Object.values(refMarkers).forEach(m => {
          const el = m.getElement();
          if (el) el.style.display = '';
        });
      }
    }, 300);
    panel.querySelector('#chat-input').value = '';
  }

  // 開場白
  addMsg('你好！我是福岡旅遊助理 🗾\n問我行程、天氣、住宿、餐廳、景點等問題，或點下方快捷按鈕！', 'bot');

  // 事件
  fab.onclick = () => { panel.classList.toggle('open'); };
  panel.querySelector('#chat-close').onclick = () => { panel.classList.remove('open'); highlightDay(null); };
  panel.querySelector('#chat-date').onchange = e => { highlightDay(e.target.value || null); };
  panel.querySelector('#chat-send').onclick = () => ask(panel.querySelector('#chat-input').value);
  panel.querySelector('#chat-input').onkeydown = e => { if (e.key==='Enter') ask(e.target.value); };
  panel.querySelectorAll('.chip').forEach(c => c.onclick = () => {
    const date = panel.querySelector('#chat-date').value;
    ask(date ? `${date} ${c.dataset.q}` : c.dataset.q);
  });
})();
</script>
</body>
</html>
